## Casos Reales de Migración (basados en problemas vistos en producción)

- id: "21_remastered_vs_original_duration"
  description: "Remastered tiene misma duración que original pero sufijo → original gana"
  vars:
    original_name: "Bohemian Rhapsody"
    original_artist: "Queen"
    original_duration_ms: 354000
    original_isrc: "GBARL1800001"
    candidates: |
      1. "Bohemian Rhapsody" - Queen (354000 ms)
      2. "Bohemian Rhapsody (Remastered 2011)" - Queen (355000 ms)
      3. "Bohemian Rhapsody - Remastered 2011" - Queen (355000 ms)
  assert:
    - type: equals
      value: "1"

- id: "22_featuring_variation"
  description: "feat. en artista original vs candidato sin feat."
  vars:
    original_name: "Despacito"
    original_artist: "Luis Fonsi ft. Daddy Yankee"
    original_duration_ms: 288000
    original_isrc: ""
    candidates: |
      1. "Despacito" - Luis Fonsi ft. Daddy Yankee (288000 ms)
      2. "Despacito" - Luis Fonsi (288000 ms)
      3. "Despacito (Remix)" - Luis Fonsi ft. Justin Bieber (295000 ms)
  assert:
    - type: equals
      value: "1"

- id: "23_classical_movement_number"
  description: "Clásica: número de movimiento en título"
  vars:
    original_name: "Symphony No. 5 - I. Allegro con brio"
    original_artist: "Beethoven"
    original_duration_ms: 480000
    original_isrc: ""
    candidates: |
      1. "Symphony No. 5 - I. Allegro con brio" - Beethoven (480000 ms)
      2. "Symphony No. 5 - II. Andante con moto" - Beethoven (600000 ms)
      3. "Symphony No. 5" - Beethoven (2400000 ms)
  assert:
    - type: equals
      value: "1"

- id: "24_karaoke_instrumental_penalty"
  description: "Karaoke/instrumental penalizado fuertemente"
  vars:
    original_name: "Pop Hit"
    original_artist: "Pop Star"
    original_duration_ms: 200000
    original_isrc: ""
    candidates: |
      1. "Pop Hit" - Pop Star (200000 ms)
      2. "Pop Hit (Karaoke Version)" - Pop Star (200000 ms)
      3. "Pop Hit (Instrumental)" - Pop Star (200000 ms)
  assert:
    - type: equals
      value: "1"

- id: "25_tie_break_first_candidate"
  description: "Empate total tras todos los filtros → primero"
  vars:
    original_name: "Ambiguous Track"
    original_artist: "Ambiguous Artist"
    original_duration_ms: 200000
    original_isrc: ""
    candidates: |
      1. "Ambiguous Track" - Ambiguous Artist (210000 ms)
      2. "Ambiguous Track" - Ambiguous Artist (210000 ms)
      3. "Ambiguous Track" - Ambiguous Artist (210000 ms)
  assert:
    - type: equals
      value: "1"