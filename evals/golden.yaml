## Casos de Rechazo / Comportamiento Específico

- id: "16_wrong_artist_never_chosen"
  description: "Artista completamente distinto nunca gana aunque duración coincida"
  vars:
    original_name: "Imagine"
    original_artist: "John Lennon"
    original_duration_ms: 183000
    original_isrc: ""
    candidates: |
      1. "Imagine" - John Lennon (183000 ms)
      2. "Imagine" - A Perfect Circle (183000 ms)
      3. "Imagine" - Eva Cassidy (190000 ms)
  assert:
    - type: equals
      value: "1"

- id: "17_remaster_suffix_penalty"
  description: "Remaster penalizado si original no tiene remaster"
  vars:
    original_name: "Classic Song"
    original_artist: "Classic Band"
    original_duration_ms: 250000
    original_isrc: ""
    candidates: |
      1. "Classic Song" - Classic Band (255000 ms)
      2. "Classic Song (Remastered 2020)" - Classic Band (250000 ms)
      3. "Classic Song (Remastered)" - Classic Band (251000 ms)
  assert:
    - type: equals
      value: "1"

- id: "18_live_keyword_penalty"
  description: "Palabra 'live' penaliza fuerte"
  vars:
    original_name: "Rock Anthem"
    original_artist: "Rock Band"
    original_duration_ms: 240000
    original_isrc: ""
    candidates: |
      1. "Rock Anthem" - Rock Band (250000 ms)
      2. "Rock Anthem (Live at Stadium)" - Rock Band (240000 ms)
      3. "Rock Anthem (Acoustic Live)" - Rock Band (245000 ms)
  assert:
    - type: equals
      value: "1"

- id: "19_acoustic_keyword_penalty"
  description: "Palabra 'acoustic' penaliza si original no es acústica"
  vars:
    original_name: "Electric Song"
    original_artist: "Electric Band"
    original_duration_ms: 200000
    original_isrc: ""
    candidates: |
      1. "Electric Song" - Electric Band (205000 ms)
      2. "Electric Song (Acoustic Version)" - Electric Band (200000 ms)
      3. "Electric Song (Acoustic)" - Electric Band (195000 ms)
  assert:
    - type: equals
      value: "1"

- id: "20_demo_keyword_penalty"
  description: "Palabra 'demo' penaliza fuerte"
  vars:
    original_name: "Final Song"
    original_artist: "Pro Band"
    original_duration_ms: 180000
    original_isrc: ""
    candidates: |
      1. "Final Song" - Pro Band (180000 ms)
      2. "Final Song (Demo)" - Pro Band (182000 ms)
      3. "Final Song (Early Demo)" - Pro Band (185000 ms)
  assert:
    - type: equals
      value: "1"

